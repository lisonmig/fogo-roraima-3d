# Atualiza os dados do mapa e publica o site (GitHub Pages) a cada 2 horas.
# Os downloads ficam guardados entre uma execução e outra (cache), então só baixa o que é novo.
# Uma vez por dia, o arquivo histórico dos eventos de fogo do INPE é salvo no repositório,
# porque o INPE só mostra os eventos atuais.
name: Atualizar mapa

on:
  schedule:
    - cron: '17 */2 * * *'   # a cada 2 horas (horário UTC; Roraima é UTC-4)
  workflow_dispatch:          # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]

permissions:
  contents: write   # salvar o histórico dos eventos do INPE
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar bibliotecas
        run: pip install numpy pillow shapely

      - name: Recuperar downloads anteriores
        uses: actions/cache@v4
        with:
          path: dados-3d
          key: dados-3d-${{ github.run_id }}
          restore-keys: dados-3d-

      - name: Focos do INPE, tempo, CAR e DETER
        run: python -I scripts/prep_rr.py dados-3d docs || echo "::warning::falhou a atualização dos focos; o site fica com os dados anteriores"

      - name: Eventos de fogo do INPE
        run: python -I scripts/prep_eventos_inpe.py dados-3d docs || echo "::warning::falharam os eventos do INPE"

      - name: Rios e seca (réguas da ANA)
        run: |
          python -I scripts/prep_seca.py dados-3d docs || echo "::warning::falhou a seca (ANA)"
          python -I scripts/prep_rios.py dados-3d docs || echo "::warning::falharam os rios"

      - name: Estradas e imóveis do CAR (baixam de novo só a cada 30-60 dias)
        run: |
          python -I scripts/prep_estradas.py dados-3d docs || echo "::warning::falharam as estradas"
          python -I scripts/prep_car_todos.py dados-3d docs || echo "::warning::falhou o CAR"

      - name: Salvar o histórico dos eventos do INPE (uma vez por dia)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" = "04" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados-3d/rr_eventos_inpe_arquivo.json
            git diff --cached --quiet || (git commit -m "Histórico dos eventos de fogo do INPE ($(date -u +%F))" && git push)
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
